# ============================================================================
#  Technical Triveni — Cloudflare configuration
# ----------------------------------------------------------------------------
#  This file wires the app to Cloudflare's free services:
#    • D1     — the database (projects, orders, settings)
#    • R2     — file storage (FILES = paid/private, MEDIA = images/public)
#    • KV     — lightweight counters for rate-limiting (optional)
#
#  For LOCAL development these bindings are simulated automatically — you do
#  not need a Cloudflare account to run `npm run dev`.
#
#  For DEPLOYMENT, replace the REPLACE_ME ids after creating the resources.
#  Full step-by-step instructions are in DEPLOY.md.
# ============================================================================

name = "technical-triveni"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]
account_id = "9dbfac30e9cf8bc024520f15b58b2c62"

# --- Database (Cloudflare D1) ------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "triveni-db"
database_id = "8de41999-fd56-4427-8f24-f0f20c91ebef"   # from: wrangler d1 create triveni-db
migrations_dir = "migrations"

# --- File storage (Cloudflare KV) --------------------------------------------
# Free on the Workers plan (no payment method): 1 GB storage, 25 MB per file.
# Stores paid combo files, free downloads, and project images.
# (If you outgrow it, switch these to R2 buckets — see DEPLOY.md.)
[[kv_namespaces]]
binding = "BLOBS"
id = "e55eca369b0e490c9fd0f56e073d1f11"

# Same namespace, second binding — used for login/checkout rate limiting.
[[kv_namespaces]]
binding = "KV"
id = "e55eca369b0e490c9fd0f56e073d1f11"

# Same namespace, satisfies Astro's auto-enabled session store (unused here).
[[kv_namespaces]]
binding = "SESSION"
id = "e55eca369b0e490c9fd0f56e073d1f11"

# --- Non-secret build/runtime variables --------------------------------------
# SECRETS (Razorpay keys, admin password hash, session secret) are NEVER put
# here. Set them with `wrangler pages secret put <NAME>` — see DEPLOY.md.
[vars]
SITE_URL = "https://www.technicaltriveni.me"
RAZORPAY_ENABLED = "true"           # keys are set as secrets (wrangler secret put)
TURNSTILE_ENABLED = "false"         # flip to "true" once Turnstile keys are set
EMAIL_ENABLED = "true"              # BREVO_API_KEY secret is set
FROM_EMAIL = "technicaltriveniyt@gmail.com"   # must be a verified sender in Brevo
FROM_NAME = "Technical Triveni"
